# 自用 fork 构建：push 到 custom 分支即构建 arm64 安装包
# 包名 com.example.piliplus.dev（PiliPlus dev），可与官方版共存
# 签名来自仓库 secrets，每次构建签名一致，可直接覆盖安装
name: Fork Build

on:
    push:
        branches: [custom]
    workflow_dispatch:

jobs:
    android:
        name: Build Android
        runs-on: ubuntu-latest

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              run: |
                  echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                  echo storeFile='key.jks' >> android/key.properties
                  echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                  echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                  echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Apk
              run: |
                  flutter build apk --release --target-platform android-arm64 \
                    --android-project-arg dev=1 --dart-define-from-file=pili_release.json

            - name: Rename
              run: mv build/app/outputs/flutter-apk/app-release.apk "PiliPlus_dev_${{ env.version }}_arm64-v8a.apk"

            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                  name: PiliPlus_dev_${{ env.version }}
                  path: PiliPlus_dev_*.apk
                  if-no-files-found: error
                  retention-days: 30
